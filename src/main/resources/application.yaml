server:
  port: 8080
  servlet:
    context-path: /cosmeMgt

spring:
  application:
    name: cosmeMgt

  datasource:
    url: jdbc:postgresql://localhost:5432/cosme_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  signerKey: ${SIGNER_KEY}
  valid-duration: 36000 # in second
  refreshable-duration: 36000 # in seconds

momo:
  partner-code: MOMO
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_ACCESS_SECRET_KEY}
  redirect-url: http://localhost:3000
  ipn-url: https://unsounded-unchurchly-kian.ngrok-free.dev/cosmeMgt/payments/ipn-url
  api-endpoint: https://test-payment.momo.vn/v2/gateway/api
  refund_url: /refund
  IS_PAYMENT_MOCKING: true      #mock payment for testing

brevo:
  api.key: ${BREVO_API_KEY}
  sender:
    email: tranducphu.dtp@gmail.com
    name: Resto Restaurant
  brevo_url: https://api.brevo.com/v3/smtp/email

cloudinary:
  cloud_name: djhiau9nq
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET_KEY}